<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirect</title>
    <script>
      // Redirect all 404s to the index.html with the path and query string
      var pathSegmentsToKeep = 1; // Keep 'ticofactlanding' in the path
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        '/ticofactlanding/index.html?p=' +
        l.pathname.slice(0, l.pathname.lastIndexOf('/') + 1).slice(0, -1)
          .split('/')
          .slice(-pathSegmentsToKeep)
          .join('/') +
        '&q=' +
        l.search.slice(1)
      );
    </script>
  </head>
  <body>
  </body>
</html>
